# TabbyAPI config: Qwen3.8-27B EXL3 3.0 bpw + DFlash2 3.0 bpw draft, 128k context, on a 16 GB RX 9070 XT (gfx1201).
# setup/install_tabby.sh copies this to tabbyAPI/config.yml; edit that copy. Paths are relative to tabbyAPI/,
# which is where serve/run_tabby.sh starts the server.
# The MTP profiles (serve/run_tabby_long.sh, serve/run_tabby_xl.sh) override draft mode and context on the command line.
network:
  # Local only. To reach it from other machines on your tailnet, set this to the machine's Tailscale IP
  # (`tailscale ip -4`) and keep auth on. 0.0.0.0 exposes it on every interface, including your LAN.
  host: 127.0.0.1
  port: 8096
  # TabbyAPI writes a random key to tabbyAPI/api_tokens.yml on first start. Send it as `Authorization: Bearer <key>`.
  disable_auth: false
  api_servers: ["OAI"]

logging:
  log_prompt: false
  log_generation_params: false
  log_requests: false

model:
  model_dir: ../models
  model_name: Qwen3.8-27B-EXL3-SC3.0bpw-H4
  backend: exllamav3
  max_seq_len: 131072
  cache_size: 131072
  cache_mode: Q4
  gpu_split_auto: true
  autosplit_reserve: [768]
  chunk_size: 1024
  # How many requests decode together; more wait their turn. All active requests share the cache_size tokens above.
  # 3 is the default (about 195-200 tok/s combined for code through the API, vs 131-132 for one request). 4 is the
  # maximum we document (~240-245 combined) but peaked at 16.28 of 16.3 GB in our long-context test after concurrent
  # and image requests, vs 16.17 GB at 3.
  # Both need the allocator setting in setup/env.sh (PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True).
  max_batch_size: 3
  # The vision encoder stays in system RAM (~20 ms per image). Keeping it in VRAM doesn't fit at 128k.
  vision: true
  vision_offload: true
  reasoning: true
  reasoning_start_token: "<think>"
  reasoning_end_token: "</think>"
  tool_format: qwen3_coder

draft_model:
  draft_mode: model
  draft_model_dir: ../models
  # 3.0 bpw requant of incoai/Qwen3.8-27B-DFlash2 (setup/requant_draft.sh). Same speed as the 5.0 bpw quant, 0.89 vs 1.4 GB.
  # With Mia-AiLab's 5.0 bpw draft instead, use Qwen3.8-27B-DFlash2-EXL3-5.0bpw and lower max_seq_len/cache_size.
  draft_model_name: Qwen3.8-27B-DFlash2-EXL3-3.0bpw
  draft_cache_mode: Q4
  draft_num_tokens: 7

memory:
  sysmem_recurrent_cache: 4096
